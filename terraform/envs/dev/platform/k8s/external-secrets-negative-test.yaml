# throwaway: proves the iam boundary denies paths outside dev/realworld/* - apply, confirm AccessDenied, delete
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realworld-negative-test
  namespace: app-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: realworld-negative-test
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "prod/realworld/app"
