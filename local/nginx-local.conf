# local/nginx-local.conf -- local-only variant of the frontend repo's own
# nginx.conf (angular-realworld-example-app/nginx.conf, Step 2.2), mounted over
# the built-in config at container start (see docker-compose.yml's frontend
# service `volumes:`).
#
# WHY THIS FILE EXISTS: the frontend image's baked-in nginx.conf deliberately
# does NOT proxy /api anywhere -- in production that job belongs to the ALB,
# which routes /api/* to the backend target group and /* to the frontend, so
# both are reachable through one hostname/origin. There is no ALB in local
# Docker Compose, so without this file, calls to /api/* from a browser pointed
# at the frontend container would simply 404 against the static SPA bundle --
# this file's ONLY job beyond faithfully reproducing the original is to add
# that missing /api reverse-proxy hop, so local integration testing exercises
# the same single-origin shape production will have.
#
# Everything below this comment block, EXCEPT the new `location /api/` block,
# is copied unchanged from angular-realworld-example-app/nginx.conf as of
# Step 2.2 (feat/relative-api-url) -- same SPA fallback, cache headers,
# /healthz, gzip, and security headers (including the CSP, whose per-directive
# reasoning is documented at length in that file and is not repeated here to
# avoid the two copies drifting in explanatory text while the effective rules
# stay identical). If that file changes, re-sync this one by hand -- there is
# no include mechanism in it to share pieces from (it's a single monolithic
# http{} block, not conf.d-style), so a full-replacement copy is the only
# option that doesn't require touching the frontend repo (out of scope here).
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    map $uri $cache_control {
        default                      "public, max-age=3600";
        "~*\.(?:js|css)$"            "public, max-age=31536000, immutable";
        /index.html                  "no-cache";
        /healthz                     "no-store";
    }

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' code.ionicframework.com; font-src 'self' https://fonts.gstatic.com code.ionicframework.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

        # Health check: must not touch disk, so this returns a static string
        # directly instead of resolving to a file under root.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Local-only addition (Step 2.3): single-origin /api proxy ---
        # In production the ALB routes /api/* straight to the backend target
        # group; here nginx plays that role so the frontend's published host
        # port is the one and only origin the browser (and this step's
        # acceptance tests) ever talk to -- exactly like production, and
        # exercising the app's real relative `/api` calls (see
        # angular-realworld-example-app's user.service.ts / articles.service.ts,
        # Step 2.2 / feat/relative-api-url) instead of a browser-CORS setup
        # that wouldn't exist in prod.
        #
        # proxy_pass deliberately carries NO path component (just the
        # scheme+host+port: `http://backend:8080`, no trailing `/api` or `/`).
        # That is what makes nginx forward the ORIGINAL request URI to the
        # upstream unchanged -- a request for /api/tags on this proxy becomes
        # http://backend:8080/api/tags on the backend, matching its own
        # server.servlet.context-path=/api one-for-one. This sidesteps the
        # classic proxy_pass trailing-slash footgun entirely: if proxy_pass
        # instead carried a path (e.g. `http://backend:8080/` or
        # `http://backend:8080/api/`), nginx would splice that path in place
        # of the `/api/` the location matched, which either strips the /api
        # prefix the backend needs (double-strip -> 404s) or, with a mismatched
        # trailing slash, doubles it up into /api/api/... (also 404s). Omitting
        # the path avoids both failure modes -- verified against nginx's own
        # documented proxy_pass URI-splicing rule, not guessed.
        #
        # `backend` resolves via Docker Compose's embedded DNS to whatever
        # container is currently running the `backend` service on the shared
        # compose network -- no IP or port-mapping magic needed, and nothing
        # here is published to the host (only the frontend's own port is).
        location /api/ {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback: any path that isn't a real file (e.g. /article/some-slug)
        # falls back to index.html so Angular's router can take over client-side.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
